<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="stylesheet" href="signup.css">
    <link rel="icon" href="images/1logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <div class="logo-circle">CTU</div>
            <h2>Lost&Found</h2>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="how-it-works.html">How it Works</a></li>
                <li><a href="recent-reports.html">Recent Reports</a></li>
                <li><a href="browse.html">Browse</a></li>
            </ul>
        </nav>

    </header>

    <!-- SIGNUP SECTION -->
    <section class="signup-section">

        <div class="signup-card">

            <!-- TOP -->
            <div class="signup-top">

                <div class="signup-logo">SIIT</div>

                <h1>Create Account</h1>

                <p>
                    Join the CTU Lost & Found community
                </p>

            </div>

            <!-- BODY -->
            <div class="signup-body">

                <!-- FIRST + LAST NAME -->
                <div class="input-row">

                    <div class="input-group">
                        <label>FIRST NAME</label>
                        <input type="text" placeholder="Juan">
                    </div>

                    <div class="input-group">
                        <label>LAST NAME</label>
                        <input type="text" placeholder="Dela Cruz">
                    </div>

                </div>

                <!-- PHONE NUMBER -->
                <div class="input-group">
                    <label>PHONE NUMBER</label>
                    <input type="tel" placeholder="+63 912 345 6789">
                </div>

                <!-- EMAIL -->
                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" placeholder="example@gmail.com">
                </div>

                <!-- PASSWORD -->
                <div class="input-row">

                    <div class="input-group">
                        <label>PASSWORD</label>
                        <input type="password" placeholder="********">
                    </div>

                    <div class="input-group">
                        <label>CONFIRM PASSWORD</label>
                        <input type="password" placeholder="********">
                    </div>

                </div>

                <!-- BUTTON -->
                <button class="register-btn" type="submit">
                    REGISTER NOW
                </button>

                <!-- LOGIN -->
                <div class="login-link">
                    Already have an account?
                    <a href="index.html">Login here</a>
                </div>

            </div>

        </div>

    </section>
    <script src="main.js"></script>
</body>
</html>
