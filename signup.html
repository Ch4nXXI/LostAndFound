<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="stylesheet" href="signup.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <img src="images/logo.png" alt="CTU Logo" width="45" height="45">
                    <h2>Lost&Found</h2>
       </div>


        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="report.html">Report</a></li>
                <li><a href="browse.html">Browse</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>

    </header>

    <!-- SIGNUP SECTION -->
    <section class="signup-section">

        <div class="signup-card">

            <!-- TOP -->
            <div class="signup-top">

                <div class="signup-logo">CTU</div>

                <h1>Create Account</h1>

                <p>
                    Join the CTU Lost & Found community
                </p>

            </div>

            <!-- BODY -->
            <div class="signup-body">

                <!-- FIRST + LAST NAME -->
                <div class="input-row">

                    <div class="input-group">
                        <label>FIRST NAME</label>
                        <input type="text" placeholder="Juan">
                    </div>

                    <div class="input-group">
                        <label>LAST NAME</label>
                        <input type="text" placeholder="Dela Cruz">
                    </div>

                </div>

                <!-- PHONE NUMBER -->
                <div class="input-group">
                    <label>PHONE NUMBER</label>
                    <input type="tel" placeholder="+63 912 345 6789">
                </div>

                <!-- STUDENT ID -->
                <div class="input-group">
                    <label>STUDENT ID</label>
                    <input type="text" placeholder="1234567">
                </div>

                <!-- EMAIL -->
                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" placeholder="example@gmail.com">
                </div>

                <!-- PASSWORD -->
                <div class="input-row">

                    <div class="input-group">
                        <label>PASSWORD</label>
                        <input type="password" placeholder="********">
                    </div>

                    <div class="input-group">
                        <label>CONFIRM PASSWORD</label>
                        <input type="password" placeholder="********">
                    </div>

                </div>

                <!-- BUTTON -->
                <button class="register-btn" type="submit">
                    REGISTER NOW
                </button>

                <!-- LOGIN -->
                <div class="login-link">
                    Already have an account?
                    <a href="index.html">Login here</a>
                </div>

            </div>

        </div>

    </section>

    <script type="module" src="firebase.js"></script>
    <script type = "module" src="main.js"></script>
    
</body>
</html>
